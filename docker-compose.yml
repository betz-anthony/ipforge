services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipam
      POSTGRES_USER: ipam
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ipam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipam"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      # Passed as discrete parts, not a URL: the app percent-encodes them, so
      # a password containing "@" or ":" survives. Set DATABASE_URL to
      # override with a verbatim connection string.
      DB_USER: ipam
      DB_PASSWORD: ${DB_PASSWORD:-ipam}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ipam
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
